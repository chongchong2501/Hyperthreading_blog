name: Deploy Blog

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: "deploy-${{ github.ref }}"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # 部署到 Cloudflare Pages（海外用户访问）
  deploy-cloudflare:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist --project-name=blog-hyperthreading

  # ESA Pages 通过阿里云控制台 GitHub 集成自动部署，无需在此脚本中处理
  # 在 ESA 控制台授权 GitHub 后，ESA 会自动监听 push 事件部署 dist 目录
  # 配置：ESA 控制台 → 你的项目 → 仓库设置 → GitHub 仓库 chongchong2501/Hyperthreading_blog
  # 构建命令：pnpm run build
  # 输出目录：dist
